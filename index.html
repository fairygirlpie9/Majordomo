
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majordomo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quattrocento Sans', sans-serif;
      overflow-x: hidden;
      font-size: 1.125rem; /* Increased size */
    }
    .font-serif-display {
      font-family: 'Newsreader', serif;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-family: 'JetBrains Mono', monospace;
    }
    /* Dark Mode: Prussian Blue panels on Black background */
    .glass-card {
      background: rgba(20, 33, 61, 0.9); /* #14213D High Opacity */
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    /* Light Mode: White panels on Alabaster background */
    .glass-card-light {
      background: rgba(255, 255, 255, 0.9); /* White */
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="bg-[#000000] text-[#E5E5E5]">
  <div id="root"></div>
</body>
</html>
